name: Build Omniarp

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,     name: Mac }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-latest, name: Linux }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Re-sign Mac plugins (ad-hoc)
        if: runner.os == 'macOS'
        run: |
          # JUCE adds files to the bundles after linking, which breaks the linker's signature.
          # Re-sign last so Ableton (Apple Silicon) loads the VST3 without any Terminal fix.
          ART=build/Omniarp_artefacts/Release
          for b in "$ART/VST3/Omniarp.vst3" "$ART/AU/Omniarp.component"; do
            xattr -cr "$b"
            codesign --force --deep --sign - --timestamp=none "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
          done

      - name: Package (Mac .pkg)
        if: runner.os == 'macOS'
        run: |
          ART=build/Omniarp_artefacts/Release
          mkdir -p pkgroot/vst3 pkgroot/au
          cp -R "$ART/VST3/Omniarp.vst3" pkgroot/vst3/
          cp -R "$ART/AU/Omniarp.component" pkgroot/au/
          pkgbuild --root pkgroot/vst3 --identifier com.ticcoross.omniarp.vst3 --version 1.2.0 \
                   --install-location "/Library/Audio/Plug-Ins/VST3" vst3.pkg
          pkgbuild --root pkgroot/au --identifier com.ticcoross.omniarp.au --version 1.2.0 \
                   --install-location "/Library/Audio/Plug-Ins/Components" au.pkg
          productbuild --package vst3.pkg --package au.pkg Omniarp-Mac.pkg

      - name: Package (Windows .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "build/Omniarp_artefacts/Release/VST3/Omniarp.vst3" -DestinationPath Omniarp-Windows-VST3.zip

      - name: Package (Linux .tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd build/Omniarp_artefacts/Release
          tar czf $GITHUB_WORKSPACE/Omniarp-Linux.tar.gz VST3 LV2

      - name: Include manual
        shell: bash
        run: cp Docs/Omniarp-Manual.pdf .

      - uses: actions/upload-artifact@v4
        with:
          name: Omniarp-${{ matrix.name }}
          path: |
            Omniarp-Mac.pkg
            Omniarp-Windows-VST3.zip
            Omniarp-Linux.tar.gz
            Omniarp-Manual.pdf
          if-no-files-found: ignore

  release:
    needs: build
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Omniarp 1.2.0
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Omniarp 1.2.0 by Ticco Ross - keyboard TRANSPOSE zone (play keys below a split to transpose instantly) with beat/bar timing, and a more compact panel.
            - **Mac**: Omniarp-Mac.pkg (AU + VST3, Apple Silicon and Intel)
            - **Windows**: Omniarp-Windows-VST3.zip
            - **Linux**: Omniarp-Linux.tar.gz (VST3 + LV2)
            - **Manual**: Omniarp-Manual.pdf
          files: dist/*
